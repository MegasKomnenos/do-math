version: "v0.4"

project:
  name: "Unimodality of parking functions by maximum displacement"
  description: >-
    Let b(n, l) be the number of parking functions of length n whose maximum
    displacement is exactly l, where the displacement of a car is the distance
    between the spot it takes and its preferred spot. The formalization proves
    in Lean 4 with Mathlib that for every n >= 1 the sequence
    b(n, 0), b(n, 1), ..., b(n, n-1) is unimodal, which is Conjecture 6.5 of
    Celano, Elder, Hadaway, Harris, Martin, Priestley and Udell
    (arXiv:2507.07243). The numbers b(n, l) are defined directly from the
    parking process. The proof starts from a recursion for the number of
    parking functions whose maximum displacement is at most a given bound,
    proved in the library from the parking process, and follows the sign of
    the difference b(n, k) - b(n, k-1) along columns k as n grows. Rows with
    n <= 16 and several finite ranges are settled by tables that Lean's kernel
    evaluates in exact integer arithmetic; analytic estimates, including
    Robbins' bounds for the factorial, settle the remaining ranges. The proof
    depends only on the axioms propext, Classical.choice and Quot.sound. It
    was found, written and formalized by AI sessions of an autonomous
    research system; no person has refereed it.
  authors:
    - "Jaehyoung Kim"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jaehyoung Kim"

