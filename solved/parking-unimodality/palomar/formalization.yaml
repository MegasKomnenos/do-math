      models:
        - "Claude Fable 5 family (Anthropic): attempts, explorations, formalization, peer review, organization"
        - "Claude Opus 5 family (Anthropic): review sessions"
        - "GPT-6.1 (OpenAI): part of the earlier run only"
      framework: "do-math, an autonomous research system built in the maintainer's own repository"
      tool_setup: >-
        Parallel AI sessions in fixed roles (attempt, explore, formalize, peer
        review, review, organize) worked on a shared Lean library; a review
        session decided each publication. Lean 4 with Mathlib was used
        throughout. Two runs: an earlier run (5-13 November 2026) reached an
        informal proof that was not formalized; the later run (19-23 November
        2026), on Claude models only, found the proof that this library
        formalizes. An AI operator session started and tended the runs.
      cost:
        wall_time: "about three weeks of calendar time, 5-24 November 2026"
        spend_usd: "subscription-based"
        hardware: "local Windows machine; models used through their providers' services"
      prompting_notes: >-
        The person who commissioned the research chose the conjecture and gave
        standing written inputs to the running research, for example to give
        more weight to understanding the problem than to large computations.
        The proofs and the Lean code were written by AI sessions.
    - method: agent
      models: []
      framework: "Claude Code"
      tool_setup: >-
        After the research, AI agent sessions simplified the library from 114
        to 61 modules, extended it to 62 so that it states every numbered
        statement of the accompanying paper, and made the module-system port
        and the Palomar files of this repository. The models of these
        sessions are not recorded here.
      cost:
        wall_time: "about two days, 23-25 November 2026"
        spend_usd: "subscription-based"
        hardware: "local Windows machine"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The mathematics, the Lean proof, the informal records and the
    accompanying paper were produced by AI sessions. The human role was to
    commission the research, set its goals and standards, steer it through
    standing inputs, and decide what to publish. README.md gives the
    production account in more detail.

fidelity:
  divergences: >-
    Spots and preferences are numbered 0, ..., n-1 instead of 1, ..., n; a
    displacement is a difference of a spot and a preference and is unchanged.
    b n l is defined for every natural number l and is 0 when l >= n; the
    theorem uses it only for l <= n-1. The second range of the unimodality
    condition, l <= n-2 in the conjecture, is written l + 1 <= n - 1 so that
    it is empty for n = 1 under natural-number subtraction, as it is in the
    conjecture. No other divergence is known.

review:
  status: agent-reviewed
  reviewers:
    - "AI review sessions of the research system (Claude Opus 5 family)"
    - "Jaehyoung Kim (the Lean statement only)"
  notes: >-
    Every published result of the research was accepted by an AI review
    session before publication, and the correspondence of the Lean statement
    with the conjecture was judged by AI review sessions. Jaehyoung Kim, the
    maintainer, read the Lean statement in Challenge.lean against Conjecture
    6.5 before submission. Lean's kernel checks the proof. No person has
    refereed the mathematics.

alignment:
  namespace: "Parking"
  statements:
    - source: "Conjecture 6.5 of arXiv:2507.07243"
      lean: "Parking.root_unimodal"
      module: "Parking.Unimodal"
      status: proved
      note: >-
        Stated in Challenge.lean with the definitions of Parking/Defs.lean
        copied verbatim; the conventions are listed under fidelity.

