related_formalizations: []

status:
  scope: >-
    Formalized: the unimodality asserted by Conjecture 6.5, for every
    n >= 1, about the numbers b(n, l) defined from the parking process
    itself. Not restated: the conjecture's displayed chain also records the
    end values b(n, 0) = n! and b(n, n-1) = n^(n-2), which its source proves;
    the Lean theorem does not restate them, and it neither asserts nor
    assumes the count (n+1)^(n-1) of parking functions. Spots and preferences are numbered from 0 instead of
    from 1, which does not change any displacement.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "Parking.root_unimodal: for every n >= 1 the sequence b(n, 0), ..., b(n, n-1) is unimodal."

