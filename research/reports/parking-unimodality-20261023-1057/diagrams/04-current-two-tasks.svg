" x="-156.96875" y="-51" width="313.9375" height="102"></rect><g class="label" style="" transform="translate(-126.96875, -36)"><rect></rect><foreignObject width="253.9375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>작업 1 · 진행 중<br>혼합 조건·도착 전달 공식을<br>원 주차 과정에 대해 Lean으로 증명</p></span></div></foreignObject></g></g><g class="node default" id="currentwork-flowchart-B-3" data-look="classic" transform="translate(528, 187)"><rect class="basic label-container" style="" x="-156.0625" y="-51" width="312.125" height="102"></rect><g class="label" style="" transform="translate(-126.0625, -36)"><rect></rect><foreignObject width="252.125" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>작업 2 · 진행 중<br>숲 표현을 독립 확립하고<br>분기를 포함해 두 경계의 증가 연구</p></span></div></foreignObject></g></g><g class="node default" id="currentwork-flowchart-C-5" data-look="classic" transform="translate(164.96875, 339)"><rect class="basic label-container" style="" x="-136.1875" y="-51" width="272.375" height="102"></rect><g class="label" style="" transform="translate(-106.1875, -36)"><rect></rect><foreignObject width="212.375" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>성공하면<br>후속 비교가 쓰는 공식·하계의<br>일반 형식 근거 확보</p></span></div></foreignObject></g></g><g class="node default" id="currentwork-flowchart-D-7" data-look="classic" transform="translate(528, 339)"><rect class="basic label-container" style="" x="-137.25" y="-51" width="274.5" height="102"></rect><g class="label" style="" transform="translate(-107.25, -36)"><rect></rect><foreignObject width="214.5" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>원하는 성과<br>모든 해당 크기에서<br>두 경계의 증가를 실제로 증명</p></span></div></foreignObject></g></g><g class="node default" id="currentwork-flowchart-E-9" data-look="classic" transform="translate(346.484375, 503)"><rect class="basic label-container" style="" x="-102.4375" y="-39" width="204.875" height="78"></rect><g class="label" style="" transform="translate(-72.4375, -24)"><rect></rect><foreignObject width="144.875" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>남은 증가 영역과<br>감소 뒤 재증가 배제</p></span></div></foreignObject></g></g><g class="node default" id="currentwork-flowchart-F-13" data-look="classic" transform="translate(346.484375, 679)"><rect class="basic label-container" style="" x="-91.625" y="-39" width="183.25" height="78"></rect><g class="label" style="" transform="translate(-61.625, -24)"><rect></rect><foreignObject width="123.25" height="48"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 360px; text-align: center;"><span class="nodeLabel"><p>전체 단봉성 해결<br>아직 미달성</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="currentwork-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs><defs><filter id="currentwork-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"></feDropShadow></filter></defs></svg>