<div class="c-article-body"><section><h2>Abstract</h2><p>Abstract fixture boundary</p></section><div class="main-content"><section><h2>Introduction</h2><div class="c-article-section__content"><span class="mathjax-tex">$${\mathsf{BPP}}\subseteq {\mathsf{NISQ}}\subseteq {\mathsf{BQP}}\,.$$</span><figure><figcaption><b class="c-article-section__figure-caption" id="Fig1">Fig. 1: Illustration of the <span class="u-sans-serif">NISQ</span> complexity class.</b></figcaption><div class="c-article-section__figure-content"><div class="c-article-section__figure-item"><picture class="c-article-section__figure-picture"><source srcset="//media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41467-023-41217-6/MediaObjects/41467_2023_41217_Fig1_HTML.png?as=webp" type="image/webp"/><img alt="Fig. 1: Illustration of the NISQ complexity class." aria-describedby="figure-1-desc" height="220" loading="lazy" src="//media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41467-023-41217-6/MediaObjects/41467_2023_41217_Fig1_HTML.png" width="685"/></picture><div class="c-article-section__figure-link"><a aria-label="Full size image figure 1" class="c-article__pill-button" href="/articles/s41467-023-41217-6/figures/1" rel="nofollow"><span>Full size image</span><svg aria-hidden="true" class="u-icon" focusable="false" height="16" role="img" width="16"><use xlink:href="#icon-eds-i-chevron-right-small" xmlns:xlink="http://www.w3.org/1999/xlink"></use></svg></a></div></div><div class="c-article-section__figure-description" id="figure-1-desc"><p><b>a</b> Complexity classes: <span class="u-sans-serif">NISQ</span> contains problems that can be solved by classical computation (<span class="u-sans-serif">BPP</span>), and some problems that can be solved by quantum computation (<span class="u-sans-serif">BQP</span>). <b>b</b> <span class="u-sans-serif">NISQ</span> algorithm: An algorithm in the complexity class <span class="u-sans-serif">NISQ</span> is modeled by a hybrid quantum-classical algorithm, where a classical computer can specify the circuit to run on a noisy quantum device and the device would run a noisy version of the circuit and return a random classical bitstring obtained from noisy measurement.</p></div></div></figure></div></section></div><section class="c-article-recommendations"><h2>Unrelated recommendations</h2></section></div>
